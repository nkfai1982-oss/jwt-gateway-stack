worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
env JWT_ISSUER;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout  65;

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;;";
    lua_shared_dict resty_jwt_verification_cache_jwks 5m;
    resolver 127.0.0.11 ipv6=off valid=30s;
    lua_socket_connect_timeout 1000ms;
    lua_socket_send_timeout 1000ms;
    lua_socket_read_timeout 1000ms;

    init_by_lua_block {
        local jwks = require("resty.jwt-verification-jwks")
        local local_cache = require("resty.jwt-verification-jwks-cache-local")
        local ok, err = jwks.init(local_cache)
        if not ok then
            error("unable to initialize JWKS cache: " .. tostring(err))
        end
        jwks.set_cache_ttl(60)
        jwks.set_http_timeouts_ms(1000, 1000, 1000)
    }

    server {
        listen 8080;
        server_name _;

        set $jwks_uri "http://auth-service:8080/.well-known/jwks.json";

        location = /healthz {
            return 200 '{"status":"ok"}';
        }

        location = /auth/token {
            limit_except POST { deny all; }
            proxy_pass http://auth-service:8080/auth/token;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /.well-known/jwks.json {
            proxy_pass http://auth-service:8080/.well-known/jwks.json;
            proxy_set_header Host $host;
        }

        location /component-a/ {
            set $expected_audience "component-a";
            set $required_scope "component-a.read";
            access_by_lua_file /usr/local/openresty/nginx/lua/authorize.lua;
            proxy_pass http://spring-api:8080/;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /component-b/ {
            set $expected_audience "component-b";
            set $required_scope "component-b.read";
            access_by_lua_file /usr/local/openresty/nginx/lua/authorize.lua;
            proxy_pass http://python-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404 '{"error":"not_found"}';
        }
    }
}
